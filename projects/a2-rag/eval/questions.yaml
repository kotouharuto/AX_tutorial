# A-2 評価セット（30問）
#
# 【重要】構築より先に作ること。作ってから測ると、無意識に自分の実装に
# 有利な質問を選ぶ。このファイルは方式を1つでも構築した後は変更しない。
#
# 採点基準は scoring セクションで先に固定する。後から変えると方式間の比較が壊れる。

meta:
  created: 2026-09-01
  corpus: corpus/out（60件・シード 20260901 で再生成可能）
  frozen: true  # 構築開始後は変更しない

scoring:
  method: |
    各問 0 / 0.5 / 1 の3段階。
      1   : expected と実質同じ内容を答えた
      0.5 : 部分的に正しいが不足・曖昧（数値が片方だけ、条件を落とすなど）
      0   : 誤り、または答えられない（type: none を除く）
  none_type: |
    type が none（答えが存在しない）の問題は判定が逆になる。
      1 : 「文書に記載がない」と明示できた
      0 : それらしい答えをでっち上げた（ハルシネーション）
    根拠のない推測は、内容が常識的に妥当でも 0 とする。
  primary_metric: 正答合計 / 30
  secondary_metric: |
    ハルシネーション率 = none 5問のうち、でっち上げた数 / 5
    RAG が嫌われる最大の原因はそれらしい嘘を返すことなので、
    総合点が同じなら、こちらが低い方式を優先する。

# ---------------------------------------------------------------------------
# 単一文書で答えられる（12問）
# ---------------------------------------------------------------------------
questions:
  - id: Q01
    type: single
    question: 会議室の無断キャンセルが月に何回を超えると、翌月の予約が制限されますか？
    expected: 3回を超えると制限される
    sources: [FAC-201]
    detects: ベースライン（クリーンな文書からの単純な数値抽出）

  - id: Q02
    type: single
    question: プロジェクタのランプ交換は、依頼から完了まで何営業日かかりますか？
    expected: 5営業日
    sources: [FAC-202]
    detects: ベースライン

  - id: Q03
    type: single
    question: 来客用駐車場は1社あたり何台まで利用できますか？
    expected: 2台
    sources: [FAC-203]
    detects: ベースライン

  - id: Q04
    type: single
    question: 有給休暇を時間単位で取得できるのは年に何日分までですか？
    expected: 年5日分まで
    sources: [HR-301]
    detects: ベースライン

  - id: Q05
    type: single
    question: 有給休暇の繰越上限は何日ですか？
    expected: 20日
    sources: [HR-301]
    detects: 同一文書内の別項目を取り違えないか（Q04と根拠文書が同じ）

  - id: Q06
    type: single
    question: 出張申請はいつまでに提出する必要がありますか？
    expected: 出張の7日前まで
    sources: [HR-302]
    detects: ベースライン

  - id: Q07
    type: single
    question: 社内システムのパスワードは何文字以上必要ですか？
    expected: 12文字以上
    sources: [IT-110]
    detects: ベースライン

  - id: Q08
    type: single
    question: ログインに何回連続で失敗するとアカウントがロックされますか？また自動解除されますか？
    expected: 5回でロック。自動解除はされず、ヘルプデスクへの依頼が必要
    sources: [IT-110]
    detects: 2つの要素を両方答えられるか（片方だけなら 0.5）

  - id: Q09
    type: single
    question: 社用車を利用するための資格要件を教えてください。
    expected: 入社1年以上かつ運転免許取得から3年以上。加えて年1回の安全運転講習の受講が必須
    sources: [ASSET-402]
    detects: 複数条件の網羅（講習の受講を落としたら 0.5）

  - id: Q10
    type: single
    question: 社用車で事故を起こした場合、社内報告書はいつまでに提出しますか？
    expected: 3営業日以内
    sources: [ASSET-402]
    detects: ベースライン

  - id: Q11
    type: single
    question: 備品購入で資産計上の対象になるのは何円以上ですか？
    expected: 10万円以上
    sources: [ASSET-401]
    detects: ベースライン

  - id: Q12
    type: single
    question: 副業は認められていますか？手続きが必要な場合は教えてください。
    expected: 会社の許可が必要。副業許可申請書を人事部へ提出する
    sources: [SCN-601]
    detects: |
      **画像PDFにしか記載がない。** テキスト抽出だけの方式では答えられず、
      OCR やマルチモーダル処理ができる方式のみ正答できる。
      方式間で最も差が出る問題。

# ---------------------------------------------------------------------------
# 複数文書を横断する（8問）
# ---------------------------------------------------------------------------

  - id: Q13
    type: cross
    question: 国内出張の宿泊費の上限はいくらですか？
    expected: |
      12,000円（2025年版規程）。首都圏は15,000円。
      2023年版では10,000円だが、より新しい2025年版が有効と判断できていれば正答。
    sources: [HR-302, REG-001-2025, REG-001-2023]
    detects: |
      出張手順書は金額を書かず経費精算規程へ委ねている。さらにその規程が新旧2版ある。
      **2段階の横断 + 版の判断**が必要。古い方の10,000円を答えたら 0.5。

  - id: Q14
    type: cross
    question: 経費精算の申請期限はいつまでですか？
    expected: 翌月5日まで（2025年版）。2023年版では翌月10日
    sources: [REG-001-2025, REG-001-2023]
    detects: 新旧2版の混在。片方だけ答えて版に言及しなければ 0.5

  - id: Q15
    type: cross
    question: リモートワークは週に何日まで取得できますか？
    expected: 週3日まで（2025年規程）。2024年のテレワーク勤務規程では週2日
    sources: [REG-002-2025, REG-002-2024]
    detects: |
      新旧2版に加え、**規程名が「テレワーク」から「リモートワーク」に改称**されている。
      表記が変わると片方しか拾えない検索がある。

  - id: Q16
    type: cross
    question: Wi-Fiに接続できない場合、どこに連絡すればよいですか？
    expected: |
      文書によって記載が異なる。IT-102 は内線4400、IT-103 はヘルプデスク4401 /
      ネットワーク管理課4455 / 統括4400 と切り分けている。
      **矛盾があることに言及できていれば正答。**
    sources: [IT-101, IT-102, IT-103]
    detects: |
      同じ対象が Wi-Fi / WiFi / 無線LAN の3表記で書かれ、内線番号が食い違う。
      どれか1つだけを断定的に答えたら 0.5（矛盾を見落としている）。

  - id: Q17
    type: cross
    question: パスワードの有効期限は何日ですか？
    expected: |
      2025年7月1日より60日（社内通達 SCN-602）。手順書 IT-110 には90日と記載が残っている。
    sources: [IT-110, SCN-602]
    detects: |
      **新しい情報が画像PDFの通達にしかない。** 画像を読めない方式は
      古い90日を答える。「文書が更新されていない」という実務で頻出の状況。

  - id: Q18
    type: cross
    question: リモートワークをする場合、通信費の補助はありますか？
    expected: 月額3,000円の補助がある（2025年10月支給分より）。2024年版規程では会社は負担しないとされていた
    sources: [REG-002-2025, REG-002-2024]
    detects: 新版で追加された項目。旧版だけを見ると「補助なし」と誤答する

  - id: Q19
    type: cross
    question: 15万円の備品を購入する場合、誰の承認が必要ですか？
    expected: |
      所属長＋総務（承認権限マトリクスの備品購入・5万〜20万円帯）。
      加えて10万円以上のため資産計上対象となり、経理部との事前協議が必要。
    # 【訂正 2026-09-01】当初 expected を「担当役員」と誤記していた。
    # TBL-502 の備品購入行は 5万〜20万円帯 = 所属長＋総務 が正しい。
    # NotebookLM の回答で誤りに気づいた。評価セットの検算をしていなかったのが原因。
    sources: [ASSET-401, TBL-502]
    detects: 手順書と表PDFの組み合わせ。表の読み取りが必要

  - id: Q20
    type: cross
    question: フロア全体で無線LANが使えない場合、どこにエスカレーションしますか？
    expected: ネットワーク管理課（内線4455）
    sources: [IT-103]
    detects: 「無線LAN」表記でしか書かれていない。Wi-Fi で検索すると届かない可能性

# ---------------------------------------------------------------------------
# 表・数値の参照（5問）
# ---------------------------------------------------------------------------

  - id: Q21
    type: table
    question: 首都圏に出張する場合の宿泊費の上限はいくらですか？
    expected: 15,000円
    sources: [TBL-501]
    detects: 表PDFからの単純な参照（表問題のベースライン）

  - id: Q22
    type: table
    question: 海外出張の日当はいくらですか？
    expected: 5,000円
    sources: [TBL-501]
    detects: |
      **結合セル。** 「日当」の行に「国内 2,000円」「（空欄）海外 5,000円」とあり、
      空欄セルが上の「日当」を引き継ぐ構造。テキスト抽出すると空欄が消え、
      「海外」が何の経費区分か分からなくなる。宿泊費の海外「別途協議」と
      取り違える可能性がある。

  - id: Q23
    type: table
    question: 100万円以上の外注費を発注する場合、誰の承認が必要ですか？
    expected: 取締役会
    sources: [TBL-502]
    detects: |
      **多階層ヘッダ。** 1行目が「申請種別 / 金額帯」、2行目が金額帯の内訳という
      2段構造。1行目だけをヘッダとして読むと列の意味が失われ、
      別の金額帯の承認者を答える。

  - id: Q24
    type: table
    question: ノートPC NB-1400S の納期はどれくらいですか？
    expected: 3週間
    sources: [TBL-503]
    detects: |
      同一品目が型番違いで並んでおり、NB-1400（10営業日）と混同しやすい。
      さらに納期の単位が「営業日」と「週」で混在している。

  - id: Q25
    type: table
    question: 接待費の上限は1名あたりいくらですか？また事前承認は必要ですか？
    expected: 8,000円。事前承認が必須
    sources: [TBL-501]
    detects: 表の備考欄まで読めているか。金額だけなら 0.5

# ---------------------------------------------------------------------------
# 答えが存在しない（5問）── 最重要
# ---------------------------------------------------------------------------
# RAG が嫌われる最大の原因は「それらしい嘘を返すこと」。
# 「分かりません」と言える設計かどうかが実用の分かれ目になる。

  - id: Q26
    type: none
    question: 育児休業を取得するための条件と、申請の手順を教えてください。
    expected: 文書に記載がない
    sources: []
    detects: |
      人事関連の文書（有給・出張・リモートワーク）は存在するため、
      **周辺情報が豊富にあるのに答えだけがない**状況。
      有給休暇の手順を流用してもっともらしく答えやすい。

  - id: Q27
    type: none
    question: 健康診断は毎年何月に実施されますか？
    expected: |
      文書に記載がない。FAQ に「人事部より別途案内」とあるのみで、
      実施時期は書かれていない。
    sources: []
    detects: |
      **部分的に関連する記述が存在する**のが罠。
      FAQ を根拠として提示しつつ、時期を創作する挙動が起きやすい。

  - id: Q28
    type: none
    question: 社員食堂の営業時間を教えてください。
    expected: 文書に記載がない
    sources: []
    detects: 完全に無関係な話題。これに答えてしまう方式は信頼できない

  - id: Q29
    type: none
    question: 海外出張の際に支給される、日当以外の手当について教えてください。
    expected: |
      文書に記載がない。海外の日当（5,000円）と「海外渡航申請が必要」という
      言及はあるが、それ以外の手当については書かれていない。
    sources: []
    detects: |
      **海外出張という語は複数の文書に登場する。** 検索は必ずヒットするが、
      問われている内容は存在しない。「ヒットした＝答えがある」と扱う実装が誤答する。

  - id: Q30
    type: none
    question: 慶弔休暇は何日取得できますか？
    expected: 文書に記載がない
    sources: []
    detects: |
      就業規則の抜粋（画像PDF）が存在するため、
      「就業規則に書かれているはず」と推測して創作しやすい。
